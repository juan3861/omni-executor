[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-executor"
version = "4.1.0"
description = "OmniExecutor Agent: autonomous coding agent, hierarchical team orchestrator, self-healing browser and MCP/A2A harness"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "eval"]
pythonpath = ["src", "vendor/oh_my_hermes/src", "vendor/hermes_agent"]
norecursedirs = [
    "WpSystem",
    "$RECYCLE.BIN",
    "System Volume Information",
    "vendor",
    ".git",
    ".venv",
    "__pycache__",
    "HANDOFF_PACK",
]
addopts = "-ra --strict-markers --basetemp=F:/AetherMind_Temp/pytest_basetemp"
